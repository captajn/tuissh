name: Build

# Runs on the repository that holds this file.
#
# That is deliberate: a fork builds with the fork owner's Actions minutes, so a
# contributor's builds never draw on the upstream account. For the same reason there is
# no `pull_request_target` trigger — that one runs the base repository's workflow, with
# the base repository's quota, against a contributor's code, which is both a cost and a
# security problem.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref, so pushing twice in a row does
# not queue two full builds.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The cache is keyed on the wrapper and the version catalogue, so a Gradle or
      # dependency bump downloads once rather than on every run.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The repository root is the Gradle project, not a subdirectory. A committed
      # Windows checkout can also drop the executable bit, so this is set here as well
      # as in the index.
      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # Only the offline suite runs here. The live suites need a real SSH host and a
      # provider API key and are skipped when those variables are absent, which is
      # exactly what a fork without secrets gets.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tuissh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
