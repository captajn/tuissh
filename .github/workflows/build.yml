name: Build

# Runs on the repository that holds this file.
#
# That is deliberate: a fork builds with the fork owner's Actions minutes, so a
# contributor's builds never draw on the upstream account. For the same reason there is
# no `pull_request_target` trigger — that one runs the base repository's workflow with
# the base repository's quota against a contributor's code, which is both a cost and a
# security problem.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref, so pushing twice in a row does
# not queue two full builds.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The wrapper cache is keyed on the wrapper properties, so a Gradle upgrade
      # downloads once instead of on every run.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make the wrapper executable
        run: chmod +x gradlew
        working-directory: neo-android

      # Only the offline suite runs here. The live suites need a real SSH host and a
      # provider API key, and are skipped when their environment variables are absent —
      # which is exactly what a fork without secrets gets.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain --stacktrace
        working-directory: neo-android

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain
        working-directory: neo-android

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: neo-android/app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tuissh-debug-apk
          path: neo-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
